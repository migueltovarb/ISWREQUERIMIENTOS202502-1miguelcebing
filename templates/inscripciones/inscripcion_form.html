{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:74vh;">
    <div class="card shadow-lg border-0"
         style="background:rgba(255,255,255,0.98); min-width:350px; max-width:420px; border-radius:22px;">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold" style="color:#1976d2;">
                Inscribirse al Evento: {{ evento.nombre }}
            </h2>
            <form method="post">
                {% csrf_token %}
                <p class="mb-2"><strong>Fecha:</strong> {{ evento.fecha|date:"d/m/Y H:i" }}</p>
                <p class="mb-2"><strong>Estado:</strong> {{ evento.estado }}</p>
                <p class="mb-2"><strong>Cupos disponibles:</strong> {{ evento.cupos }}</p>
                <input type="hidden" name="evento_id" value="{{ evento.pk }}">
                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-primary w-50 fw-bold" style="border-radius: 10px;">
                        Confirmar inscripción
                    </button>
                    <a href="{% url 'lista_eventos' %}" class="btn btn-outline-secondary w-50" style="border-radius: 10px;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
