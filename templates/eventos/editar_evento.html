{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:74vh;">
    <div class="card shadow-lg border-0"
         style="background:rgba(255,255,255,0.98); min-width:350px; max-width:480px; border-radius:22px;">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold" style="color:#1976d2;">Editar Evento</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Evento</label>
                    <input type="text" class="form-control rounded-3" name="nombre" value="{{ evento.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha y Hora</label>
                    <input type="datetime-local" class="form-control rounded-3" name="fecha" value="{{ evento.fecha|date:"Y-m-d\TH:i" }}" required>
                </div>
                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text" class="form-control rounded-3" name="estado" value="{{ evento.estado }}" required>
                </div>
                <div class="mb-3">
                    <label for="cupos" class="form-label">Cupos</label>
                    <input type="number" class="form-control rounded-3" name="cupos" value="{{ evento.cupos }}" min="1" required>
                </div>
                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-primary w-50 fw-bold" style="border-radius: 10px;">Guardar Cambios</button>
                    <a href="{% url 'detalle_evento' evento.pk %}" class="btn btn-outline-secondary w-50" style="border-radius:10px;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
