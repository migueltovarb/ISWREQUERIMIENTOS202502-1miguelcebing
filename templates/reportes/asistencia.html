{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:74vh;">
    <div class="card shadow-lg border-0"
         style="background:rgba(255,255,255,0.98); min-width:450px; max-width:650px; border-radius:22px;">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold" style="color:#1976d2;">
                Reporte de Asistencia
            </h2>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle"
                       style="background:#f9fafd; border-radius:15px;">
                    <thead class="table-light">
                        <tr>
                            <th>Evento</th>
                            <th>Asistentes</th>
                            <th>Generado en</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for rep in reportes %}
                        <tr>
                            <td>{{ rep.evento.nombre }}</td>
                            <td>{{ rep.asistentes }}</td>
                            <td>{{ rep.generado_en|date:"d/m/Y H:i" }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center text-secondary">
                                No hay reportes de asistencia disponibles.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
