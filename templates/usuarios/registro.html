{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:77vh;">
    <div class="card shadow-lg border-0"
         style="background:rgba(255,255,255,0.96); min-width:330px; max-width:430px; border-radius:22px;">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold" style="color:#1976d2;">Registro de Usuario</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control rounded-3" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control rounded-3" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control rounded-3" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control rounded-3" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="rol" class="form-label">Rol</label>
                    <select class="form-select rounded-3" name="rol" required>
                        <option value="asistente">Asistente</option>
                        <option value="organizador">Organizador</option>
                        <option value="logistica">Personal de Logística</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit"
                        class="btn btn-primary w-100 mt-2 fw-bold"
                        style="border-radius: 11px;">Registrarse</button>
                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-danger mt-2">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'login' %}" class="link-primary fw-semibold">
                    ¿Ya tienes una cuenta? Inicia sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
