{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:74vh;">
    <div class="card shadow-lg border-0" style="min-width:350px;max-width:420px;">
        <div class="card-body text-center">
            <h2 class="mb-3 fw-bold" style="color:#1976d2;">Detalle del Usuario</h2>
            <div class="mb-3"><strong>Nombre:</strong> {{ usuario.nombre }}</div>
            <div class="mb-3"><strong>Usuario:</strong> {{ usuario.username }}</div>
            <div class="mb-3"><strong>Email:</strong> {{ usuario.email }}</div>
            <div class="mb-3"><strong>Rol:</strong> {{ usuario.rol }}</div>
            <div class="d-flex justify-content-center gap-3 mt-3">
                <a href="{% url 'editar_usuario' usuario.pk %}" class="btn btn-warning fw-bold">Editar</a>
                <a href="{% url 'eliminar_usuario' usuario.pk %}" class="btn btn-danger fw-bold">Eliminar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
