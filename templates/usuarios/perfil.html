{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:72vh;">
    <div class="card shadow-lg border-0"
         style="background:rgba(255,255,255,0.97); min-width:330px; max-width:410px; border-radius:22px;">
        <div class="card-body d-flex flex-column align-items-center">
            <h2 class="mb-4 fw-bold text-center" style="color:#1976d2;">Mi Perfil</h2>
            <div class="mb-3">
                <div class="d-flex justify-content-center">
                    <div style="width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg,#e6f0fa,#bee3fd); display: flex; align-items: center; justify-content: center; box-shadow:0 2px 12px #accee522;">
                        <svg width="55" height="55" fill="#86aee5" viewBox="0 0 24 24">
                            <circle cx="12" cy="8.5" r="4"/>
                            <path d="M20 19.25c0-3.15-3.29-5.25-8-5.25s-8 2.1-8 5.25V21h16z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="w-100 px-1 px-md-3 px-lg-4 pb-2">
                <p class="mb-2 mt-1"><strong>Nombre:</strong> {{ user.nombre }}</p>
                <p class="mb-2"><strong>Correo electrónico:</strong> {{ user.email }}</p>
                <p class="mb-2"><strong>Usuario:</strong> {{ user.username }}</p>
                <p class="mb-1"><strong>Rol:</strong> {{ user.rol|default:"No asignado" }}</p>
            </div>
            <a href="{% url 'logout' %}"
                class="btn btn-outline-danger w-100 fw-bold mt-3"
                style="border-radius: 11px;">Cerrar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
