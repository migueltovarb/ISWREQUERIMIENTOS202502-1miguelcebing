{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:74vh;">
    <div class="card shadow-lg border-0"
         style="background:rgba(255,255,255,0.97); min-width:350px; max-width:430px; border-radius:22px;">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold" style="color:#1976d2;">
                Realizar Pago de Inscripción
            </h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="monto" class="form-label">Monto</label>
                    <input type="number" min="0" step="0.01" class="form-control rounded-3" name="monto" required>
                </div>
                <div class="mb-3">
                    <label for="metodo" class="form-label">Método de pago</label>
                    <select class="form-select rounded-3" name="metodo" required>
                        <option value="tarjeta">Tarjeta</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="transferencia">Transferencia</option>
                    </select>
                </div>
                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-primary w-50 fw-bold" style="border-radius: 10px;">
                        Realizar pago
                    </button>
                    <a href="{% url 'mis_inscripciones' %}" class="btn btn-outline-secondary w-50" style="border-radius: 10px;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
